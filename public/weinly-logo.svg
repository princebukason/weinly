<svg width="200" height="56" viewBox="0 0 200 56" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Icon mark: forest green rounded square -->
  <rect width="56" height="56" rx="13" fill="#24483f"/>

  <!-- W mark: two woven strokes suggesting textile threads -->
  <!-- Left stroke: top-left down to left valley, up to center peak -->
  <path d="M10 14 L18 41 L28 22" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right stroke: center peak down to right valley, up to top-right -->
  <path d="M28 22 L38 41 L46 14" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Terracotta accent dot at the center peak — the "crossing thread" -->
  <circle cx="28" cy="22" r="4" fill="#c9935b"/>
  <!-- Subtle inner highlight on the dot -->
  <circle cx="27" cy="21" r="1.5" fill="white" opacity="0.35"/>

  <!-- Wordmark: "weinly" lowercase, tight, premium weight -->
  <text
    x="70" y="38"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="800"
    fill="#1f2933"
    letter-spacing="-1"
  >weinly</text>

  <!-- Terracotta accent dot after wordmark — period-like finishing mark -->
  <circle cx="187" cy="37" r="3.5" fill="#c9935b"/>

</svg>
